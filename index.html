<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4efe6">
<meta name="description" content="Tabela em sequência para guardar dinheiro: 1, 2, 3, 4 e segue. Cada número vale esse valor em reais.">
<title>A Tabela — guardar 10 mil ou 20 mil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1220'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%239e1b2c' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Art direction
   Audience: pessoa no Brasil marcando reais até fechar 10 mil ou 20 mil
   Voice: institutional + striking
   Type: Fraunces / Source Sans 3
   Signal: #9e1b2c on #f4efe6 / ink #0c1220
   Signature: serifa gigante na apresentação; campo de bolinhas na tabela
*/
:root {
  --font-display: "Fraunces", Georgia, serif;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --ink: #0c1220;
  --ink-muted: #4a5248;
  --paper: #f4efe6;
  --paper-elev: #fffbf5;
  --line: #d9d1c7;
  --signal: #9e1b2c;
  --signal-hover: #7c1522;
  --on-signal: #fffbf5;
  --warn: #8a5a12;
  --danger: #9e1b2c;
  --bg: var(--paper);
  --fg: var(--ink);
  --radius: 2px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t: 200ms;
  --content: 1120px;
  --measure: 38rem;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 17px;
  line-height: 1.55;
}
.band-ink {
  --bg: var(--ink);
  --fg: var(--paper);
  --ink-muted: #c4bdb3;
  --line: #2a3344;
  background: var(--bg);
  color: var(--fg);
}
h1, h2, h3, .display, .fig, .valor, .resultado-valor, .marca, .passo-n {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: -0.02em;
}
p { margin: 0 0 12px; }
a { color: inherit; }
button, input { font-family: inherit; }
.skip {
  position: absolute;
  left: 16px;
  top: -48px;
  background: var(--paper);
  color: var(--ink);
  padding: 8px 12px;
  z-index: 20;
}
.skip:focus { top: 8px; outline: 2px solid var(--ink); }
.wrap {
  width: min(var(--content), calc(100% - 48px));
  margin-inline: auto;
}
.kicker {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 0 0 12px;
}
.display-xl {
  font-size: clamp(44px, 8vw, 88px);
  line-height: 0.98;
  letter-spacing: -0.03em;
  margin: 0 0 20px;
}
.body { font-size: 18px; max-width: var(--measure); }
.small { font-size: 14px; line-height: 1.45; color: var(--ink-muted); }
.fig {
  font-size: clamp(36px, 4vw, 56px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 12px 20px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: var(--signal);
  color: var(--on-signal);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--t) var(--ease);
}
.btn:hover { background: var(--signal-hover); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--fg);
  border-color: var(--line);
}
.btn-secondary:hover { background: transparent; border-color: var(--ink); }
.band-ink .btn {
  background: var(--paper);
  color: var(--ink);
}
.band-ink .btn:hover { background: #ebe4d8; }
.band-ink .btn:focus-visible { outline-color: var(--paper); }
.texto {
  background: none;
  border: 0;
  padding: 10px 0;
  min-height: 44px;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.texto:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.limpar { margin: 4px 0 0; }
.limpar[hidden] { display: none; }
.limpar p { margin: 8px 0; font-size: 15px; max-width: 40rem; }
.limpar .acoes { margin: 0 0 4px; }
.rascunho { margin: 10px 0 2px; }
.rascunho[hidden] { display: none; }
.rascunho .pergunta {
  font-family: var(--font-display);
  font-size: clamp(26px, 4vw, 34px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.rascunho .small { margin: 0 0 8px; max-width: 40rem; }
.rascunho .acoes { margin: 0; }
.barra-fixa {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 64px;
}
.marca {
  font-size: 22px;
  text-decoration: none;
  color: var(--ink);
}
.liga {
  font-size: 14px;
  font-weight: 600;
  text-underline-offset: 3px;
}
.hero {
  display: grid;
  grid-template-columns: 1.35fr 0.8fr;
  gap: 48px;
  align-items: end;
  padding: 56px 0 72px;
}
.hero-fig {
  border-left: 2px solid var(--signal);
  padding-left: 24px;
}
.hero-fig .fig + .fig { margin-top: 8px; }
.passos { list-style: none; margin: 0; padding: 0 0 16px; }
.passos li {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 16px;
  border-top: 1px solid var(--line);
  padding: 28px 0;
}
.passo-n { font-size: 40px; line-height: 1; }
.passos h2 { font-size: clamp(26px, 3vw, 32px); line-height: 1.15; margin: 0 0 8px; }
.passos p { max-width: var(--measure); margin: 0; }
.band-inner {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 32px;
  align-items: end;
  padding: 72px 0;
}
.band-inner h2 {
  font-size: clamp(36px, 5vw, 64px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  margin: 0;
  max-width: 12ch;
}
.band-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.specs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  padding: 8px 0 64px;
}
.specs h3 { font-size: 32px; margin: 0 0 8px; }
table.spec {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
table.spec th {
  text-align: left;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
table.spec td {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
table.spec tfoot th {
  text-align: left;
  font-size: 15px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink);
  padding-top: 12px;
}
table.spec .num, table.spec th.num { text-align: right; }
.fim { padding-bottom: 48px; }
.retomada a { font-weight: 600; }
.meta-bloco { padding: 48px 0 56px; }
.meta-bloco h2, .gigante {
  font-size: clamp(56px, 8vw, 88px);
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin: 0 0 16px;
}
.trilho { height: 2px; background: var(--line); margin: 14px 0; }
.trilho > span { display: block; height: 100%; width: 0; background: var(--signal); }
.topo {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 8px 0 12px;
}
.topo-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 52px;
}
.topo-nav .voltar,
.topo-nav .btn { flex: 0 0 auto; }
.topo-nav .kicker {
  flex: 1;
  min-width: 0;
  margin: 0;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.voltar {
  font-size: 14px;
  font-weight: 600;
  text-underline-offset: 3px;
}
.valor {
  font-size: clamp(40px, 6vw, 72px);
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin: 4px 0 0;
  font-variant-numeric: tabular-nums;
}
#sub { margin: 8px 0 0; font-size: 15px; color: var(--ink-muted); }
.filtros {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 2px;
  align-items: center;
}
.filtros .rotulo {
  flex: 0 0 auto;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 6px 4px; flex: 0 0 1px; }
.chip {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.chip span { color: var(--ink-muted); font-weight: 500; margin-left: 6px; }
.chip.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.is-on span { color: inherit; }
.chip:focus-visible, .bolha:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.legenda { margin: 14px 0 8px; }
.aviso, .painel {
  max-width: 40rem;
  margin: 8px 0 20px;
  scroll-margin-top: 280px;
}
.aviso { border: 1px solid var(--line); padding: 16px 16px 12px; }
.aviso p { margin: 0 0 12px; }
.painel { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0 20px; }
.painel h2 { font-size: clamp(28px, 4vw, 36px); line-height: 1.1; margin: 0 0 8px; }
.campo { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 16px 0 8px; }
.campo label { font-size: 13px; font-weight: 600; }
input[type="text"] {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  width: min(100%, 240px);
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper-elev);
  color: var(--ink);
}
input[type="text"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input.is-erro { border-color: var(--danger); }
.erro { color: var(--danger); font-size: 14px; min-height: 0; margin: 0; }
.erro:empty { display: none; }
.atalhos, .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.resultado-valor {
  font-size: 40px;
  line-height: 1;
  letter-spacing: -0.03em;
  margin: 12px 0 8px;
  font-variant-numeric: tabular-nums;
}
.formula { font-variant-numeric: tabular-nums; margin: 0 0 8px; }
.nota-memoria { color: var(--warn); margin: 12px 0; }
#grade { margin-top: 8px; }
.grupo { margin: 0 0 28px; }
.grupo .kicker { margin: 0 0 12px; }
.grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 12px 10px;
}
.bolha {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper-elev);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  padding: 0;
  cursor: pointer;
  scroll-margin: 280px;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.bolha:hover { border-color: var(--ink); }
.bolha:active:not(.is-marked):not(.is-draft) { background: #e7e0d4; }
.bolha.is-draft {
  background: var(--signal);
  border-color: var(--signal);
  color: var(--on-signal);
}
.bolha.is-draft:hover { background: var(--signal-hover); border-color: var(--signal-hover); }
.bolha.is-marked {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.bolha.is-suggested { outline: 2px solid var(--signal); outline-offset: 3px; }
.rodape {
  margin-top: 36px;
  padding: 24px 0 72px;
  border-top: 1px solid var(--line);
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
@media (max-width: 800px) {
  .wrap { width: min(var(--content), calc(100% - 32px)); }
  .hero, .band-inner, .specs { grid-template-columns: 1fr; }
  .hero { padding: 32px 0 40px; gap: 28px; }
  .band-inner { padding: 48px 0; }
  .passos li { grid-template-columns: 64px 1fr; }
  .passo-n { font-size: 32px; }
  .grade { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
@media (forced-colors: active) {
  .bolha { border: 1px solid ButtonText; }
  .bolha.is-marked, .bolha.is-draft { background: Highlight; color: HighlightText; forced-color-adjust: none; }
  .bolha.is-suggested { outline: 2px solid Highlight; }
}
</style>
</head>

<noscript>
  <p style="font-family: Georgia, serif; padding: 24px;">Ative o JavaScript para usar a tabela neste navegador.</p>
</noscript>
<script>
(function () {
  "use strict";

  // Chaves separadas: a sequência de 10 mil não lê a de 20 mil.
  var PLANS = {
    "10k": {
      id: "10k",
      key: "tabela-10mil-seq",
      last: 141,
      name: "10 mil",
      title: "Tabela de 10 mil",
      hash: "#tabela/10k"
    },
    "20k": {
      id: "20k",
      key: "tabela-20mil-seq",
      last: 200,
      name: "20 mil",
      title: "Tabela de 20 mil",
      hash: "#tabela/20k"
    }
  };

  var moneyFmt = new Intl.NumberFormat("pt-BR", {
    style: "currency",
    currency: "BRL",
    maximumFractionDigits: 0
  });
  var intFmt = new Intl.NumberFormat("pt-BR");

  function money(n) { return moneyFmt.format(n); }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A primeira vez que uma soma fica alcançável grava o caminho.
  // A ordem das notas muda qual combinação aparece.
  function solve(cap, counts, order) {
    var ok = new Uint8Array(cap + 1);
    var parent = new Int32Array(cap + 1);
    var vi, value, count, k, s, nxt;
    parent.fill(-1);
    ok[0] = 1;
    for (vi = 0; vi < order.length; vi++) {
      value = order[vi];
      count = counts.get(value) || 0;
      if (value <= 0 || count <= 0) continue;
      for (k = 0; k < count; k++) {
        for (s = cap - value; s >= 0; s--) {
          nxt = s + value;
          if (ok[s] && !ok[nxt]) {
            ok[nxt] = 1;
            parent[nxt] = s;
          }
        }
      }
    }
    return { ok: ok, parent: parent };
  }

  function comboFrom(parent, amount) {
    var out = [];
    var s = amount;
    var guard = 0;
    var prev;
    while (s > 0) {
      prev = parent[s];
      if (prev < 0 || prev >= s || ++guard > 400) return null;
      out.push(s - prev);
      s = prev;
    }
    return out;
  }

  function orderFor(mode, attempt, values) {
    var arr = values.slice();
    var rng, i, j, tmp;
    if (mode === "large" || (mode === "cycle" && attempt % 3 === 0)) {
      arr.sort(function (a, b) { return b - a; });
    } else if (mode === "small" || (mode === "cycle" && attempt % 3 === 1)) {
      arr.sort(function (a, b) { return a - b; });
    } else {
      rng = mulberry32((attempt + 1) * 10007 + arr.reduce(function (x, y) { return x + y; }, 0));
      for (i = arr.length - 1; i > 0; i--) {
        j = Math.floor(rng() * (i + 1));
        tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
    }
    return arr;
  }

  function remainingMap(cells, marked) {
    var map = new Map();
    var i, v;
    for (i = 0; i < cells.length; i++) {
      if (marked.has(i)) continue;
      v = cells[i];
      map.set(v, (map.get(v) || 0) + 1);
    }
    return map;
  }

  function sumMap(map) {
    var total = 0;
    map.forEach(function (count, value) { total += value * count; });
    return total;
  }

  function assignIndices(cells, marked, values, rotate) {
    var buckets = new Map();
    var need = new Map();
    var indices = [];
    var i, v, list, c, start, k;
    for (i = 0; i < cells.length; i++) {
      if (marked.has(i)) continue;
      v = cells[i];
      list = buckets.get(v);
      if (!list) {
        list = [];
        buckets.set(v, list);
      }
      list.push(i);
    }
    for (i = 0; i < values.length; i++) {
      v = values[i];
      need.set(v, (need.get(v) || 0) + 1);
    }
    need.forEach(function (count, value) {
      var bucket = buckets.get(value) || [];
      if (bucket.length < count) {
        indices = null;
        return;
      }
      if (!indices) return;
      start = rotate % bucket.length;
      for (k = 0; k < count; k++) indices.push(bucket[(start + k) % bucket.length]);
    });
    return indices;
  }

  function selfCheck() {
    var errors = [];
    Object.keys(PLANS).forEach(function (key) {
      var plan = PLANS[key];
      var cells = [];
      var i, sum;
      for (i = 1; i <= plan.last; i++) cells.push(i);
      plan.cells = cells;
      plan.goal = plan.last * (plan.last + 1) / 2;
      plan.blurb = "De 1 até " + intFmt.format(plan.last) + ", em ordem. Completar soma " + money(plan.goal) + ".";
      sum = 0;
      for (i = 0; i < cells.length; i++) {
        sum += cells[i];
        if (cells[i] !== i + 1) errors.push("fora de ordem " + key);
      }
      if (sum !== plan.goal || cells.length !== plan.last) errors.push("soma " + key + " " + sum);
    });
    if (PLANS["10k"].goal !== 10011 || PLANS["10k"].last !== 141) errors.push("10 mil");
    if (PLANS["20k"].goal !== 20100 || PLANS["20k"].last !== 200) errors.push("20 mil");
    var map = new Map([[5, 2], [10, 1]]);
    var solved = solve(20, map, [10, 5]);
    var combo = comboFrom(solved.parent, 15);
    if (!solved.ok[15] || !combo || combo.reduce(function (a, b) { return a + b; }, 0) !== 15) errors.push("dp");
    if (solved.ok[3]) errors.push("dp falso");
    var cells = [10, 10, 50];
    var marked = new Set([2]);
    var idx = assignIndices(cells, marked, [10, 10], 1);
    if (!idx || idx.length !== 2 || idx[0] === idx[1]) errors.push("indices");
    return errors;
  }

  var memory = { "10k": null, "20k": null };
  var memoryOnly = false;
  var ui = {
    planId: "10k",
    suggestion: null,
    suggestOpen: false,
    pendingUnmark: null,
    confirmReset: false,
    undo: null,
    draft: new Set(),
    formError: ""
  };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var app = document.getElementById("app");

  function readPlan(id) {
    if (memory[id]) return memory[id];
    var plan = PLANS[id];
    var set = new Set();
    try {
      var raw = localStorage.getItem(plan.key);
      if (raw) {
        var data = JSON.parse(raw);
        var list = data && Array.isArray(data.marked) ? data.marked : [];
        for (var i = 0; i < list.length; i++) {
          var n = list[i];

  function parseReais(raw) {
    var s0 = String(raw).trim().replace(/\s+/g, "").replace(/^R\$/i, "");
    var value, parts, inteiro, frac, bits, digits, thousands, i;
    if (!s0) return { empty: true };
    if (!/^[\d.,]+$/.test(s0)) return { error: "invalido" };
    if (s0.indexOf(",") !== -1) {
      parts = s0.split(",");
      if (parts.length !== 2) return { error: "invalido" };
      inteiro = parts[0].replace(/\./g, "");
      frac = parts[1];
      if (!/^\d+$/.test(inteiro) || !/^\d{1,2}$/.test(frac)) return { error: "invalido" };
      if (Number(frac) !== 0) return { error: "centavos" };
      if (inteiro.length > 7) return { error: "alto" };
      value = Number(inteiro);
    } else if (s0.indexOf(".") !== -1) {
      bits = s0.split(".");
      thousands = true;
      for (i = 0; i < bits.length; i++) {
        if (!/^\d+$/.test(bits[i])) thousands = false;
        else if (i === 0 && (bits[i].length < 1 || bits[i].length > 3)) thousands = false;
        else if (i > 0 && bits[i].length !== 3) thousands = false;
      }
      if (!thousands) return { error: "invalido" };
      digits = bits.join("");
      if (digits.length > 7) return { error: "alto" };
      value = Number(digits);
    } else {
      if (!/^\d+$/.test(s0) || s0.length > 7) return { error: "alto" };
      value = Number(s0);
    }
    if (!Number.isSafeInteger(value)) return { error: "invalido" };
    if (value <= 0) return { error: "zero" };
    return { value: value };
  }

  var ERROS = {
    invalido: "Use um valor em reais, por exemplo 50 ou 1.000.",
    centavos: "As bolinhas são valores inteiros, sem centavos.",
    alto: "Esse valor é alto demais para a tabela.",
    zero: "O valor precisa ser maior que zero.",
    empty: "Diga quanto você pode guardar agora."
  };

  function formula(values) {
    var map = new Map();
    values.forEach(function (v) { map.set(v, (map.get(v) || 0) + 1); });
    return Array.from(map.entries()).sort(function (a, b) { return a[0] - b[0]; }).map(function (pair) {
      return pair[1] > 1 ? pair[1] + " × " + money(pair[0]) : money(pair[0]);
    }).join(" + ");
  }

  function computeSuggestion(amount, attempt, mode) {
    var plan = PLANS[ui.planId];
    var set = ocupadas(plan.id);
    var counts = remainingMap(plan.cells, set);
    var keys = Array.from(counts.keys());
    var remainingSum = sumMap(counts);
    if (remainingSum <= 0 || !keys.length) return { empty: true, amount: amount };
    if (amount > remainingSum) return { over: true, amount: amount, remainingSum: remainingSum };
    var maxCoin = Math.max.apply(null, keys);
    var cap = Math.min(remainingSum, amount + maxCoin);
    var solved = solve(cap, counts, orderFor(mode, attempt, keys));
    var values, indices, sumValues, below, above, d;
    if (solved.ok[amount]) {
      values = comboFrom(solved.parent, amount);
      if (!values) return { miss: true, amount: amount, below: null, above: null };
      sumValues = values.reduce(function (a, b) { return a + b; }, 0);
      indices = assignIndices(plan.cells, set, values, attempt);
      if (!indices || sumValues !== amount) return { miss: true, amount: amount, below: null, above: null };
      return { amount: amount, indices: indices, values: values, attempt: attempt, mode: mode };
    }
    below = null;
    above = null;
    for (d = 1; d <= maxCoin; d++) {
      if (below === null && amount - d > 0 && solved.ok[amount - d]) below = amount - d;
      if (above === null && amount + d <= cap && solved.ok[amount + d]) above = amount + d;
    }
    return { miss: true, amount: amount, below: below, above: above, attempt: attempt, mode: mode };
  }

  function aplicar(amount, attempt, mode) {

    ui.suggestion = computeSuggestion(amount, attempt, mode);
    ui.suggestOpen = true;
    paintTabela();
    scrollToResult();
  }

  function escolherPorMim() {
    var plan = PLANS[ui.planId];
    var set = ocupadas(plan.id);
    var counts = remainingMap(plan.cells, set);
    var keys = Array.from(counts.keys());
    var remainingSum = sumMap(counts);
    var prefs, i, target, solved;
    if (!keys.length || remainingSum <= 0) {
      ui.suggestion = { empty: true };
      ui.suggestOpen = true;
      paintTabela();
      return;
    }
    solved = solve(remainingSum, counts, orderFor("small", 0, keys));
    target = null;
    if (remainingSum <= 200) target = remainingSum;
    else {
      prefs = [100, 50, 80, 60, 40, 150, 200, 20, 30, 10, 5, 500, 400, 300];
      for (i = 0; i < prefs.length; i++) {
        if (prefs[i] <= remainingSum && solved.ok[prefs[i]]) {
          target = prefs[i];
          break;
        }
      }
      if (target === null) target = Math.min.apply(null, keys);
    }
    var input = document.getElementById("valor");
    if (input) input.value = String(target);
    aplicar(target, 0, "small");
  }

  function outraSugestao() {
    var s = ui.suggestion;
    var prev, step, attempt, found, key;
    if (!s || s.miss || s.over || s.empty || !s.indices) return;
    prev = s.indices.slice().sort(function (a, b) { return a - b; }).join(",");
    for (step = 1; step <= 6; step++) {
      attempt = s.attempt + step;
      found = computeSuggestion(s.amount, attempt, "cycle");
      if (!found.indices) break;
      key = found.indices.slice().sort(function (a, b) { return a - b; }).join(",");
      if (key !== prev) {
        ui.suggestion = found;
        paintTabela();
        scrollToResult();
        return;
      }
    }
    ui.suggestion = {
      amount: s.amount,
      indices: s.indices,
      values: s.values,
      attempt: s.attempt,
      mode: s.mode,
      onlyOne: true
    };
    paintTabela();
  }

  function marcarSugestao() {
    var s = ui.suggestion;
    var set, fresh, i;
    if (!s || !s.indices || !s.indices.length) return;
    set = readPlan(ui.planId);
    fresh = s.indices.filter(function (index) { return !set.has(index); });
    if (!fresh.length) {
      ui.suggestion = null;
      paintTabela();
      return;
    }
    for (i = 0; i < fresh.length; i++) {
      set.add(fresh[i]);
      ui.draft.delete(fresh[i]);
    }
    ui.undo = { indices: fresh.slice(), type: "mark" };
    ui.suggestion = null;
    ui.pendingUnmark = null;
    ui.confirmReset = false;
    writePlan(ui.planId);
    if (stats(ui.planId).done) ui.suggestOpen = false;
    paintTabela();
  }

  function onBubble(index) {
    var plan = PLANS[ui.planId];
    var set;
    if (!Number.isInteger(index) || index < 0 || index >= plan.cells.length) return;
    set = readPlan(plan.id);
    ui.confirmReset = false;
    if (set.has(index)) {
      ui.pendingUnmark = index;
      paintAviso();
      return;
    }
    ui.pendingUnmark = null;
    ui.suggestion = null;
    if (ui.draft.has(index)) ui.draft.delete(index);
    else ui.draft.add(index);
    paintTabela();
  }

  function confirmarRascunho() {
    var set = readPlan(ui.planId);
    var fresh = [];
    ui.draft.forEach(function (index) {
      if (!set.has(index)) {
        set.add(index);
        fresh.push(index);
      }
    });
    ui.draft = new Set();
    ui.pendingUnmark = null;
    ui.confirmReset = false;
    if (fresh.length) {
      ui.undo = { indices: fresh.slice(), type: "mark" };
      writePlan(ui.planId);
      if (stats(ui.planId).done) ui.suggestOpen = false;
    }
    paintTabela();
  }

  function descartarRascunho() {
    ui.draft = new Set();
    paintTabela();
  }

  function confirmarDesmarcar() {
    var index = ui.pendingUnmark;
    var set = readPlan(ui.planId);
    if (!Number.isInteger(index) || !set.has(index)) {
      ui.pendingUnmark = null;
      paintTabela();
      return;
    }
    set.delete(index);
    ui.undo = { indices: [index], type: "unmark" };
    ui.pendingUnmark = null;
    ui.suggestion = null;
    writePlan(ui.planId);
    paintTabela();
  }

  function desfazer() {
    var u = ui.undo;
    var set, i;
    if (!u) return;
    set = readPlan(ui.planId);
    for (i = 0; i < u.indices.length; i++) {
      if (u.type === "mark") set.delete(u.indices[i]);
      else set.add(u.indices[i]);
    }
    ui.undo = null;
    ui.pendingUnmark = null;
    writePlan(ui.planId);
    paintTabela();
  }

  function paintStats() {
    var plan = PLANS[ui.planId];
    var st = stats(plan.id);
    var salvo = document.getElementById("salvo");
    var sub = document.getElementById("sub");
    var fill = document.getElementById("trilho-fill");
    var suggest = document.getElementById("btn-sugerir");
    var mem = document.getElementById("nota-memoria");
    salvo.textContent = money(st.saved);
    if (st.done) sub.textContent = "Do 1 ao " + intFmt.format(plan.last) + " · tabela completa";
    else if (st.marked === 0) sub.textContent = "Do 1 ao " + intFmt.format(plan.last) + " · nada marcado · faltam " + money(plan.goal);
    else sub.textContent = intFmt.format(st.marked) + " de " + intFmt.format(st.total) + " bolinhas · faltam " + money(st.left);
    fill.style.width = (st.saved / plan.goal) * 100 + "%";
    suggest.disabled = st.done;
    suggest.textContent = st.done ? "Completa" : (ui.suggestOpen ? "Fechar" : "Sugerir");
    suggest.setAttribute("aria-expanded", ui.suggestOpen ? "true" : "false");
    mem.hidden = !memoryOnly;
    var undo = document.getElementById("desfazer");
    if (ui.undo) {
      undo.hidden = false;
      undo.textContent = ui.undo.type === "mark"
        ? "Desfazer última marcação"
        : (ui.undo.type === "clear" ? "Desfazer e recuperar as marcas" : "Desfazer e marcar de novo");
    } else undo.hidden = true;
  }

  function paintSaltos() {
    var plan = PLANS[ui.planId];
    var box = document.getElementById("filtros");
    var active = document.activeElement;
    var restore = active && active.dataset ? active.dataset.jump || "" : "";
    var start, end, chip, rotulo;
    box.replaceChildren();
    rotulo = el("span", "rotulo", "Ir para");
    box.appendChild(rotulo);
    start = 1;
    while (start <= plan.last) {
      end = Math.min(start + 19, plan.last);
      if (plan.last - end > 0 && plan.last - end < 10) end = plan.last;
      chip = btn(null, "chip", start + "–" + end);
      chip.dataset.jump = String(start);
      chip.setAttribute("aria-label", "Ir para o número " + start);
      box.appendChild(chip);
      start = end + 1;
    }
    if (restore) {
      var again = box.querySelector('[data-jump="' + restore + '"]');
      if (again) again.focus({ preventScroll: true });
    }
  }

  function paintAviso() {
    var box = document.getElementById("aviso");
    var plan = PLANS[ui.planId];
    var index = ui.pendingUnmark;
    box.replaceChildren();
    if (!Number.isInteger(index)) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    var p = el("p", null, "A bolinha de " + money(plan.cells[index]) + " já está marcada. Desmarcar tira esse valor do total guardado.");
    var row = el("div", "acoes");
    row.appendChild(btn("confirmar-desmarcar", "btn", "Desmarcar"));
    row.appendChild(btn("manter-marcada", "btn btn-secondary", "Manter"));
    box.append(p, row);
  }

  function paintPainel() {
    var painel = document.getElementById("painel");
    var erro = document.getElementById("erro");
    var input = document.getElementById("valor");
    var box = document.getElementById("resultado");
    var s = ui.suggestion;
    var p, row, note;
    painel.hidden = !ui.suggestOpen;
    erro.textContent = ui.formError || "";
    input.classList.toggle("is-erro", Boolean(ui.formError));
    input.setAttribute("aria-invalid", ui.formError ? "true" : "false");
    box.replaceChildren();
    if (!s) return;
    if (s.empty) {
      box.appendChild(el("p", null, "Não há bolinha livre nesta tabela."));
      return;
    }
    if (s.over) {
      box.appendChild(el("p", null, "Esse valor passa do que ainda está livre, " + money(s.remainingSum) + "."));
      row = el("div", "acoes");
      var usarResto = btn("usar-resto", "btn", "Sugerir os " + money(s.remainingSum) + " que faltam");
      usarResto.dataset.amount = String(s.remainingSum);
      row.appendChild(usarResto);
      box.appendChild(row);
      return;
    }
    if (s.miss) {
      box.appendChild(el("p", null, "Não fecha em " + money(s.amount) + " com as bolinhas livres."));
      row = el("div", "acoes");
      if (s.below) {
        var abaixo = btn("usar-abaixo", "btn", "Usar " + money(s.below));
        abaixo.dataset.amount = String(s.below);
        row.appendChild(abaixo);
      }
      if (s.above) {
        var acima = btn("usar-acima", "btn btn-secondary", "Usar " + money(s.above));
        acima.dataset.amount = String(s.above);
        row.appendChild(acima);
      }
      if (!s.below && !s.above) box.appendChild(el("p", "small", "Nenhuma bolinha livre chega perto desse valor."));
      else box.appendChild(row);
      return;
    }
    box.appendChild(el("p", "kicker", "Combinação"));
    box.appendChild(el("p", "resultado-valor", money(s.amount)));
    p = el("p", "formula");
    p.textContent = s.indices.length + (s.indices.length === 1 ? " bolinha · " : " bolinhas · ") + formula(s.values);
    box.appendChild(p);
    note = el("p", "small", s.onlyOne
      ? "Esta é a única combinação com as bolinhas livres. Nada é marcado até você confirmar."
      : "Nada é marcado até você confirmar.");
    box.appendChild(note);
    row = el("div", "acoes");
    row.appendChild(btn("marcar-sugestao", "btn", "Marcar estas"));
    if (!s.onlyOne) row.appendChild(btn("outra-sugestao", "btn btn-secondary", "Outra sugestão"));
    row.appendChild(btn("cancelar-sugestao", "btn btn-secondary", "Cancelar"));
    box.appendChild(row);
  }

  function bolhaButton(item, marked, suggested, draft) {
    var b = document.createElement("button");
    var estado = marked ? "guardada" : (draft ? "por confirmar" : "livre");
    b.type = "button";
    b.className = "bolha";
    b.dataset.i = String(item.i);
    if (marked) b.classList.add("is-marked");
    if (draft) b.classList.add("is-draft");
    if (suggested) b.classList.add("is-suggested");
    b.setAttribute("aria-pressed", marked || draft ? "true" : "false");
    b.setAttribute("aria-label", money(item.v) + ", " + estado + (suggested ? ", sugerida" : ""));
    b.appendChild(el("span", null, String(item.v)));
    return b;
  }

  function paintGrade() {
    var plan = PLANS[ui.planId];
    var set = readPlan(plan.id);
    var grade = document.getElementById("grade");
    var active = document.activeElement;
    var restoreI = active && active.classList && active.classList.contains("bolha") ? active.dataset.i : "";
    var suggested = new Set((ui.suggestion && ui.suggestion.indices) || []);
    var frag = document.createDocumentFragment();
    var row = el("div", "grade");
    var i;
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", "Números de 1 a " + plan.last + ", em ordem");
    for (i = 0; i < plan.cells.length; i++) {
      row.appendChild(bolhaButton({ v: plan.cells[i], i: i }, set.has(i), suggested.has(i), ui.draft.has(i) && !set.has(i)));
    }
    frag.appendChild(row);
    grade.replaceChildren(frag);
    if (restoreI) {
      var again = grade.querySelector('.bolha[data-i="' + restoreI + '"]');
      if (again) again.focus({ preventScroll: true });
    }
  }

  function fillLimpar(zone) {
    var plan = PLANS[ui.planId];
    var st = stats(plan.id);
    var pedir, p, row, apagar, manter;
    zone.replaceChildren();
    if (st.marked === 0) {
      zone.hidden = true;
      return;
    }
    zone.hidden = false;
    if (!ui.confirmReset) {
      pedir = btn(null, "texto", "Desmarcar todas");
      pedir.dataset.acao = "pedir-zerar";
      zone.appendChild(pedir);
      return;
    }
    p = el("p", null, "Apagar as " + intFmt.format(st.marked) + " marcas desta tabela? Some " + money(st.saved) + " do total. A outra meta não muda.");
    row = el("div", "acoes");
    apagar = btn(null, "btn", "Apagar todas");
    apagar.dataset.acao = "confirmar-zerar";
    manter = btn(null, "btn btn-secondary", "Manter as marcas");
    manter.dataset.acao = "cancelar-zerar";
    row.append(apagar, manter);
    zone.append(p, row);
  }

  function paintReset() {
    fillLimpar(document.getElementById("zona-limpar"));
    fillLimpar(document.getElementById("zona-zerar"));
  }

  function paintRascunho() {
    var zone = document.getElementById("zona-rascunho");
    var plan = PLANS[ui.planId];
    var n = ui.draft.size;
    var sum = 0;
    var p, row, sim, nao;
    zone.replaceChildren();
    if (!n) {
      zone.hidden = true;
      return;
    }
    ui.draft.forEach(function (index) { sum += plan.cells[index]; });
    zone.hidden = false;
    zone.appendChild(el("p", "pergunta", "Deseja confirmar?"));
    p = el("p", "small", intFmt.format(n) + (n === 1 ? " bolinha vermelha" : " bolinhas vermelhas") + " · " + money(sum) + ". Sem confirmar, elas saem e fica só o que já estava guardado.");
    row = el("div", "acoes");
    sim = btn(null, "btn", "Confirmar");
    sim.dataset.acao = "confirmar-rascunho";
    nao = btn(null, "btn btn-secondary", "Não confirmar");
    nao.dataset.acao = "descartar-rascunho";
    row.append(sim, nao);
    zone.append(p, row);
  }

  function paintTabela() {
    if (!document.getElementById("salvo")) return;
    paintStats();
    paintSaltos();
    paintRascunho();
    paintAviso();
    paintPainel();
    paintGrade();
    paintReset();
  }

  function onSubmit(event) {
    var parsed;
    event.preventDefault();
    parsed = parseReais(document.getElementById("valor").value);
    if (parsed.empty) {
      ui.formError = ERROS.empty;
      ui.suggestion = null;
      paintTabela();
      return;
    }
    if (parsed.error) {
      ui.formError = ERROS[parsed.error] || ERROS.invalido;
      ui.suggestion = null;
      paintTabela();
      return;
    }
    aplicar(parsed.value, 0, "large");
  }

  function onRootClick(event) {
    var amountBtn, jumpBtn, bubble, amount, start, alvo;
    amountBtn = event.target.closest("[data-amount]");
    if (amountBtn && amountBtn.dataset.amount) {
      amount = Number(amountBtn.dataset.amount);
      var input = document.getElementById("valor");
      if (input) input.value = String(amount);
      aplicar(amount, 0, "large");
      return;
    }
    jumpBtn = event.target.closest("[data-jump]");
    if (jumpBtn && jumpBtn.dataset.jump) {
      start = Number(jumpBtn.dataset.jump);
      alvo = document.querySelector('.bolha[data-i="' + (start - 1) + '"]');
      if (alvo) alvo.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
      return;
    }
    bubble = event.target.closest(".bolha");
    if (bubble && event.currentTarget.contains(bubble)) {
      onBubble(Number(bubble.dataset.i));
      return;
    }
    var acaoEl = event.target.closest("[data-acao]");
    if (acaoEl && event.currentTarget.contains(acaoEl)) {
      if (acaoEl.dataset.acao === "pedir-zerar") {
        ui.confirmReset = true;
        ui.pendingUnmark = null;
        paintAviso();
        paintReset();
        return;
      }
      if (acaoEl.dataset.acao === "cancelar-zerar") {
        ui.confirmReset = false;
        paintReset();
        return;
      }
      if (acaoEl.dataset.acao === "confirmar-rascunho") {
        confirmarRascunho();
        return;
      }
      if (acaoEl.dataset.acao === "descartar-rascunho") {
        descartarRascunho();
        return;
      }
      if (acaoEl.dataset.acao === "confirmar-zerar") {
        var prev = Array.from(readPlan(ui.planId));
        resetPlan(ui.planId);
        ui.draft = new Set();
        ui.confirmReset = false;
        ui.suggestion = null;
        ui.undo = prev.length ? { indices: prev, type: "clear" } : null;
        ui.pendingUnmark = null;
        ui.suggestOpen = false;
        ui.formError = "";
        paintTabela();
        window.scrollTo(0, 0);
        return;
      }
    }
    switch (event.target.id) {
      case "btn-sugerir":
        if (stats(ui.planId).done) return;
        ui.suggestOpen = !ui.suggestOpen;
        if (!ui.suggestOpen) ui.suggestion = null;
        paintTabela();
        if (ui.suggestOpen) {
          document.getElementById("painel").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
          document.getElementById("valor").focus({ preventScroll: true });
        }
        break;
      case "por-mim":
        escolherPorMim();
        break;
      case "marcar-sugestao":
        marcarSugestao();
        break;
      case "outra-sugestao":
        outraSugestao();
        break;
      case "cancelar-sugestao":
        ui.suggestion = null;
        paintTabela();
        break;
      case "confirmar-desmarcar":
        confirmarDesmarcar();
        break;
      case "manter-marcada":
        ui.pendingUnmark = null;
        paintAviso();
        break;
      case "desfazer":
        desfazer();
        break;
      default:
        break;
    }
  }

  function renderTabela(id) {
    var screen = "tabela-" + id;
    if (app.dataset.screen === screen) {
      paintTabela();
      return;
    }
    if (ui.planId !== id) {
      ui.suggestion = null;
      ui.suggestOpen = false;
      ui.pendingUnmark = null;
      ui.confirmReset = false;
      ui.undo = null;
      ui.draft = new Set();
      ui.formError = "";
    }
    ui.planId = id;
    app.dataset.screen = screen;
    var root = shellTabela(PLANS[id]);
    app.replaceChildren(root);
    root.addEventListener("click", onRootClick);
    root.addEventListener("submit", onSubmit);
    paintTabela();
  }

  function render() {
    var r = route();
    var key = screenKey(r);
    var changed = app.dataset.screen !== key;
    if (r.name !== "tabela" || r.id !== ui.planId) ui.draft = new Set();
    document.title = titleFor(r);
    if (r.name === "inicio") renderInicio();
    else if (r.name === "metas") renderMetas();
    else renderTabela(r.id);
    if (changed) {
      window.scrollTo(0, 0);
      focusHeading();
    }
  }

  var check = selfCheck();
  if (check.length) {
    app.dataset.screen = "erro";
    app.appendChild(el("p", "wrap", "A tabela não passou na conferência das somas. " + check.join("; ")));
    return;
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (!app.dataset.screen || app.dataset.screen.indexOf("tabela-") !== 0) return;
    if (ui.pendingUnmark != null) {
      ui.pendingUnmark = null;
      paintAviso();
      return;
    }
    if (ui.confirmReset) {
      ui.confirmReset = false;
      paintReset();
      return;
    }
    if (ui.draft.size) {
      descartarRascunho();
      return;
    }
    if (ui.suggestOpen) {
      ui.suggestOpen = false;
      ui.suggestion = null;
      paintTabela();
    }
  });
  render();
})();
</script>
</body>
</html>
